<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Aviao Arcade</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    color: white;
    text-align: center;
    font-family: Arial;
  }
  canvas {
    display: block;
    margin: auto;
    background: #111;
  }
  button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body tabindex="0">

<h2>Use WASD ou SETAS</h2>

<canvas id="game" width="400" height="600"></canvas>
<button onclick="restart()">🔁 Reiniciar</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
let gameOver;

// Detectar teclas (SEM BUG)
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function startGame() {
  gameOver = false;

  player = {
    x: 180,
    y: 500,
    w: 40,
    h: 40,
    speed: 5
  };

  bullets = [];
  enemies = [];
  enemyBullets = [];
}

let player, bullets, enemies, enemyBullets;
startGame();

// Criar inimigos
setInterval(() => {
  if (!gameOver) {
    enemies.push({
      x: Math.random() * 360,
      y: -40,
      w: 40,
      h: 40,
      speed: 2,
      shoot: Math.random() * 100 + 80
    });
  }
}, 1000);

// Tiro do jogador
setInterval(() => {
  if (!gameOver) {
    bullets.push({
      x: player.x + player.w / 2 - 2,
      y: player.y,
      speed: 7
    });
  }
}, 300);

function update() {
  if (gameOver) return;

  // MOVIMENTO (WASD + SETAS)
  if ((keys["a"] || keys["arrowleft"]) && player.x > 0)
    player.x -= player.speed;

  if ((keys["d"] || keys["arrowright"]) && player.x < canvas.width - player.w)
    player.x += player.speed;

  if ((keys["w"] || keys["arrowup"]) && player.y > 0)
    player.y -= player.speed;

  if ((keys["s"] || keys["arrowdown"]) && player.y < canvas.height - player.h)
    player.y += player.speed;

  // Tiros jogador
  bullets.forEach(b => b.y -= b.speed);
  bullets = bullets.filter(b => b.y > -20);

  // Inimigos + tiro
  enemies.forEach(e => {
    e.y += e.speed;
    e.shoot--;

    if (e.shoot <= 0) {
      enemyBullets.push({
        x: e.x + e.w / 2 - 3,
        y: e.y + e.h,
        speed: 4
      });
      e.shoot = Math.random() * 120 + 80;
    }
  });

  enemies = enemies.filter(e => e.y < canvas.height + 50);

  // Tiros inimigos
  enemyBullets.forEach(b => b.y += b.speed);
  enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

  // Colisão tiro jogador x inimigo
  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (
        b.x < e.x + e.w &&
        b.x + 4 > e.x &&
        b.y < e.y + e.h &&
        b.y + 10 > e.y
      ) {
        bullets.splice(bi, 1);
        enemies.splice(ei, 1);
      }
    });
  });

  // Colisão tiro inimigo x jogador
  enemyBullets.forEach(b => {
    if (
      b.x < player.x + player.w &&
      b.x + 6 > player.x &&
      b.y < player.y + player.h &&
      b.y + 10 > player.y
    ) {
      gameOver = true;
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "yellow";
  bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 10));

  ctx.fillStyle = "red";
  enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

  ctx.fillStyle = "orange";
  enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, 6, 10));

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 100, 300);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

// BOTÃO REINICIAR
function restart() {
  startGame();
}
</script>

</body>
</html>
